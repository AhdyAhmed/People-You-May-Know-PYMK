[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pymk-ml-training"
version = "0.1.0"
description = "Reproducible offline model training for the PYMK recommender"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "scikit-learn>=1.5,<2",
    "skl2onnx>=1.18,<2",
]

[project.optional-dependencies]
heavy = ["torch>=2.6,<3"]
tracking = ["mlflow-skinny==3.17.1"]

[project.scripts]
pymk-train-light-ranker = "pymk_training.train_light_ranker:main"
pymk-profile-embeddings = "pymk_training.profile_embeddings:main"
pymk-train-heavy-ranker = "pymk_training.train_heavy_ranker:main"
pymk-evaluate-heavy-ranker = "pymk_training.evaluate_heavy_ranker:main"
pymk-tune-blend = "pymk_training.tune_blend:main"
pymk-publish-tracking = "pymk_training.tracking:main"
pymk-model-registry = "pymk_training.registry:main"
pymk-model-sync = "pymk_training.model_sync:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
