spring:
  application:
    name: pymk-api

  datasource:
    url: jdbc:postgresql://localhost:5432/pymk
    username: pymk
    password: pymk

  jpa:
    open-in-view: false
    # Flyway (below) owns the schema; Hibernate only validates it matches
    # the entities instead of trying to generate/alter DDL itself.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Wired up but unused until Day 12 (Redis caching).
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
