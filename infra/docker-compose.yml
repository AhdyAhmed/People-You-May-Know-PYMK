# PYMK local dev stack — Postgres/Redis plus optional Day 31 Kafka.
# Usage:
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml down          # stop
#   docker compose -f infra/docker-compose.yml down -v       # stop + wipe data
#   docker compose -f infra/docker-compose.yml --profile kafka up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pymk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pymk
      POSTGRES_USER: pymk
      POSTGRES_PASSWORD: pymk
    ports:
      - "5432:5432"
    volumes:
      - pymk_postgres_data:/var/lib/postgresql/data
      # Enables the pgvector extension on first container init (Day 5 needs this).
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pymk -d pymk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pymk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pymk_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    profiles: [kafka]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PYMK_KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: "pymkDevCluster000000001"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${PYMK_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - pymk_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.1
    profiles: [kafka]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "/pymk/create-topics.sh"]
    volumes:
      - ./kafka/create-topics.sh:/pymk/create-topics.sh:ro

volumes:
  pymk_postgres_data:
  pymk_redis_data:
  pymk_kafka_data:
