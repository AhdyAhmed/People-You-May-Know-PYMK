name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build all modules
        run: mvn -B -ntp verify

  ml-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pymk-ml-training/pyproject.toml

      - name: Install ML training project
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -e 'pymk-ml-training[heavy]'

      - name: Test temporal training, both ONNX models, embeddings and v2 datasets
        run: python -W error -m unittest discover -s pymk-ml-training/tests -v
