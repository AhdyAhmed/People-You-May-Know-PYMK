name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build all modules
        run: mvn -B -ntp verify

      - name: Verify Kafka Compose listeners and persistence
        shell: pwsh
        run: ./scripts/day31-kafka-smoke.ps1

  mlflow-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify MLflow isolation, persistence and coordinated restore
        shell: pwsh
        run: ./scripts/day36-mlflow-smoke.ps1

  ml-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pymk-ml-training/pyproject.toml

      - name: Install ML training project
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -e 'pymk-ml-training[heavy,tracking]'

      - name: Test temporal training, both ONNX models, embeddings and v2 datasets
        run: python -W error -m unittest discover -s pymk-ml-training/tests -v

      - name: Verify opt-in tracking, unchanged numeric outputs and outage recovery
        shell: pwsh
        run: ./scripts/day37-tracking-smoke.ps1 -Python python

      - name: Set up JDK for production registry parity verifier
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package production Java registry verifier
        run: mvn -B -ntp -pl pymk-batch -am -DskipTests package

      - name: Verify registry synchronization, outages and coordinated lifecycle recovery
        shell: pwsh
        run: ./scripts/day40-lifecycle-smoke.ps1 -Python python

  airflow-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package worker Java runtime
        run: mvn -B -ntp -pl pymk-api,pymk-batch -am -DskipTests package
      - name: Verify isolated Airflow contracts, scheduler execution and persistence
        shell: pwsh
        run: ./scripts/day41-airflow-smoke.ps1
      - name: Verify managed workflows, durable recovery and controlled release boundaries
        shell: pwsh
        run: ./scripts/day42-airflow-workflows-smoke.ps1 -IncludeDay45
