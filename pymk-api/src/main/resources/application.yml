spring:
  application:
    name: pymk-api

  datasource:
    url: jdbc:postgresql://localhost:5432/pymk
    username: pymk
    password: pymk

  jpa:
    open-in-view: false
    # Flyway (below) owns the schema; Hibernate only validates it matches
    # the entities instead of trying to generate/alter DDL itself.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 1s
      timeout: 1s

pymk:
  events:
    monitoring:
      enabled: ${PYMK_EVENT_MONITORING_ENABLED:false}
      poll-ms: 10000
    consumers:
      enabled: ${PYMK_EVENT_CONSUMERS_ENABLED:false}
      bootstrap-servers: ${PYMK_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    max-pending: ${PYMK_EVENTS_MAX_PENDING:100000}
    future-skew-seconds: 300
    relay:
      enabled: ${PYMK_OUTBOX_RELAY_ENABLED:false}
      bootstrap-servers: ${PYMK_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      batch-size: 50
      lease-seconds: 60
      retry-seconds: 5
      poll-ms: 1000
  serving:
    # Explicit opt-in after evaluation; L1 is the safe rollback mode.
    ranker: ${PYMK_SERVING_RANKER:L1}
    max-concurrent-requests: 2
  reranker:
    sent-weight: ${PYMK_BLEND_SENT_WEIGHT:0.5}
    accepted-weight: ${PYMK_BLEND_ACCEPTED_WEIGHT:0.5}
    employer-cap-fraction: ${PYMK_EMPLOYER_CAP_FRACTION:0.4}
  heavy-ranker:
    enabled: ${PYMK_L2_ENABLED:false}
    model-path: ${PYMK_L2_MODEL_PATH:artifacts/models/heavy/heavy-mlp-v1.onnx}
    metadata-path: ${PYMK_L2_METADATA_PATH:artifacts/models/heavy/heavy-mlp-v1.metadata.json}
    max-candidates: 500
  cache:
    enabled: true
    key-prefix: pymk
    schema-version: v1
    pipeline-version: l0-l1-v1
    model-version: light-logreg-v1
    l0-ttl: 30m
    result-ttl: 15m
  light-ranker:
    model-path: ${PYMK_L1_MODEL_PATH:artifacts/models/light-ranker/light-logreg-v1.onnx}
    metadata-path: ${PYMK_L1_METADATA_PATH:artifacts/models/light-ranker/light-logreg-v1.metadata.json}
    max-candidates: 500

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: ${PYMK_MANAGEMENT_EXPOSURE:health,info}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
